apiVersion: v1
kind: ConfigMap
metadata:
  name: spa-demo-runtime-000
  namespace: {{ .Release.Namespace }}
binaryData:
  server.js.part.000: {{ .Files.Get "files/runtime/server.js.part.000" | b64enc | quote }}
{{- range $path, $_ := .Files.Glob "files/runtime/server.js.part.*" }}
{{- if ne (base $path) "server.js.part.000" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spa-demo-runtime-{{ trimPrefix "server.js.part." (base $path) }}
  namespace: {{ $.Release.Namespace }}
binaryData:
  {{ base $path }}: {{ $.Files.Get $path | b64enc | quote }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spa-demo-site
  namespace: {{ .Release.Namespace }}
data:
  index.html: |
{{ .Files.Get "files/site/index.html" | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spa-demo-assets
  namespace: {{ .Release.Namespace }}
data:
  app.js: |
{{ .Files.Get "files/site/assets/app.js" | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spa-demo-images
  namespace: {{ .Release.Namespace }}
data:
{{- range $path, $_ := .Files.Glob "files/site/images/*" }}
  {{ base $path }}: |
{{ $.Files.Get $path | nindent 4 }}
{{- end }}
