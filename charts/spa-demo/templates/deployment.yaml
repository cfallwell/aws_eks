apiVersion: apps/v1
kind: Deployment
metadata:
  name: spa-demo
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: spa-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spa-demo
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      initContainers:
        - name: prepare-app
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p /workspace/dist/assets /workspace/dist/images
              cat /config/runtime/server.js.part.* > /workspace/server.js
              cp /config/site/index.html /workspace/dist/index.html
              cp /config/assets/app.js /workspace/dist/assets/app.js
              cp /config/images/product-*.svg /workspace/dist/images/
          volumeMounts:
            - name: app-runtime
              mountPath: /workspace
            - name: spa-demo-runtime
              mountPath: /config/runtime
            - name: spa-demo-site
              mountPath: /config/site
            - name: spa-demo-assets
              mountPath: /config/assets
            - name: spa-demo-images
              mountPath: /config/images
      containers:
        - name: app
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - node
            - /app/server.js
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              name: http
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecretName }}
          env:
            - name: S3_BUCKET_NAME
              value: {{ .Values.s3BucketName | quote }}
            - name: DATA_DIR
              value: /var/lib/spa-demo
          volumeMounts:
            - name: app-runtime
              mountPath: /app
            - name: spa-demo-data
              mountPath: /var/lib/spa-demo
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
      volumes:
        - name: app-runtime
          emptyDir: {}
        - name: spa-demo-runtime
          projected:
            sources:
              - configMap:
                  name: spa-demo-runtime-000
{{- range $path, $_ := .Files.Glob "files/runtime/server.js.part.*" }}
{{- if ne (base $path) "server.js.part.000" }}
              - configMap:
                  name: spa-demo-runtime-{{ trimPrefix "server.js.part." (base $path) }}
{{- end }}
{{- end }}
        - name: spa-demo-site
          configMap:
            name: spa-demo-site
        - name: spa-demo-assets
          configMap:
            name: spa-demo-assets
        - name: spa-demo-images
          configMap:
            name: spa-demo-images
        - name: spa-demo-data
          persistentVolumeClaim:
            claimName: spa-demo-data
