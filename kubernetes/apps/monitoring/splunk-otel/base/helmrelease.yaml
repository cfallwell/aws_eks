apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: splunk-otel
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: splunk-otel-collector
      sourceRef:
        kind: HelmRepository
        name: splunk-otel-charts
        namespace: flux-system
      interval: 12h
  valuesFrom:
    - kind: ConfigMap
      name: splunk-otel-base-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: splunk-otel-overlay-values
      valuesKey: values.yaml
      optional: true
