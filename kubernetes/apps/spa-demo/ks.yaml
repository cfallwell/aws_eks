---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-spa-demo
  namespace: flux-system
  labels:
    substitution.flux.home.arpa/enabled: "true"
spec:
  path: ./kubernetes/apps/spa-demo/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: gitrepo
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: spa-demo
      namespace: spa-demo
  interval: 30m
  retryInterval: 1m
  timeout: 5m
