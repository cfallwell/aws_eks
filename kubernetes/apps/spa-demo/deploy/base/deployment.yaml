apiVersion: apps/v1
kind: Deployment
metadata:
  name: spa-demo
  namespace: spa-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: spa-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spa-demo
    spec:
      serviceAccountName: spa-demo
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: S3_BUCKET_NAME
              value: ${spa_demo_s3_bucket_name}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
            - name: spa-demo-site
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
            - name: spa-demo-assets
              mountPath: /usr/share/nginx/html/assets
            - name: spa-demo-images
              mountPath: /usr/share/nginx/html/images
            - name: spa-demo-data
              mountPath: /var/lib/spa-demo
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
      volumes:
        - name: nginx-config
          configMap:
            name: spa-demo-nginx
        - name: spa-demo-site
          configMap:
            name: spa-demo-site
        - name: spa-demo-assets
          configMap:
            name: spa-demo-assets
        - name: spa-demo-images
          configMap:
            name: spa-demo-images
        - name: spa-demo-data
          persistentVolumeClaim:
            claimName: spa-demo-data
