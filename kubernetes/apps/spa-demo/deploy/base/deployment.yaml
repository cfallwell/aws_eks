apiVersion: apps/v1
kind: Deployment
metadata:
  name: spa-demo
  namespace: spa-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: spa-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spa-demo
    spec:
      serviceAccountName: spa-demo
      initContainers:
        - name: prepare-app
          image: node:20-alpine
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p /workspace/dist/assets /workspace/dist/images
              cp /config/runtime/package.json /workspace/package.json
              cp /config/runtime/package-lock.json /workspace/package-lock.json
              cp /config/runtime/server.js /workspace/server.js
              cp /config/site/index.html /workspace/dist/index.html
              cp /config/assets/app.js /workspace/dist/assets/app.js
              cp /config/images/product-*.svg /workspace/dist/images/
              npm ci --omit=dev --ignore-scripts --prefix /workspace
          volumeMounts:
            - name: app-runtime
              mountPath: /workspace
            - name: spa-demo-runtime
              mountPath: /config/runtime
            - name: spa-demo-site
              mountPath: /config/site
            - name: spa-demo-assets
              mountPath: /config/assets
            - name: spa-demo-images
              mountPath: /config/images
      containers:
        - name: app
          image: node:20-alpine
          command:
            - node
            - /app/server.js
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - secretRef:
                name: spa-demo-db
          env:
            - name: S3_BUCKET_NAME
              value: ${spa_demo_s3_bucket_name}
            - name: DATA_DIR
              value: /var/lib/spa-demo
          volumeMounts:
            - name: app-runtime
              mountPath: /app
            - name: spa-demo-data
              mountPath: /var/lib/spa-demo
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
      volumes:
        - name: app-runtime
          emptyDir: {}
        - name: spa-demo-runtime
          configMap:
            name: spa-demo-runtime
        - name: spa-demo-site
          configMap:
            name: spa-demo-site
        - name: spa-demo-assets
          configMap:
            name: spa-demo-assets
        - name: spa-demo-images
          configMap:
            name: spa-demo-images
        - name: spa-demo-data
          persistentVolumeClaim:
            claimName: spa-demo-data
