apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-kube-system
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/apps/kube-system
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: platform-repo
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      - kind: Secret
        name: cluster-secrets
        optional: true
